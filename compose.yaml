services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_dev_only
      POSTGRES_DB: sentinelos
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
volumes:
  postgres-data:
