name: CI
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel_ci
          POSTGRES_DB: sentinelos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinelos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sentinel:sentinel_ci@localhost:5432/sentinelos
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install
      - name: Upload resolved npm lockfile
        uses: actions/upload-artifact@v4
        with:
          name: sentinelos-package-lock
          path: package-lock.json
          retention-days: 1
      - run: git diff --exit-code -- package.json apps/api/package.json apps/web/package.json
      - name: Commit generated lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: commit resolved npm lockfile"
            git push
          fi
      - run: npm audit --audit-level=high
      - run: npm run db:migrate --workspace=@sentinelos/api
      - run: npm run db:migrate --workspace=@sentinelos/api
      - run: npm test
      - run: npm run build
