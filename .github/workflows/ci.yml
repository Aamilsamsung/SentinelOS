name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel_ci
          POSTGRES_DB: sentinelos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinelos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sentinel:sentinel_ci@localhost:5432/sentinelos
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: git diff --exit-code -- package.json package-lock.json apps/api/package.json apps/web/package.json
      - run: npm audit --audit-level=high
      - run: npm run db:migrate --workspace=@sentinelos/api
      - run: npm run db:migrate --workspace=@sentinelos/api
      - run: npm test
      - run: npm run build
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Build API Docker image
        run: docker build -t sentinelos-api:ci .
      - name: Build web Docker image
        run: docker build -f apps/web/Dockerfile -t sentinelos-web:ci .
      - name: Smoke test Compose runtime
        env:
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
        run: |
          docker compose up -d postgres redis api worker
          for attempt in {1..30}; do
            api_health="$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose ps -q api)" 2>/dev/null || true)"
            worker_health="$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose ps -q worker)" 2>/dev/null || true)"
            if [ "$api_health" = "healthy" ] && [ "$worker_health" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs api worker
          exit 1
      - name: Stop Compose runtime
        if: always()
        run: docker compose down -v
