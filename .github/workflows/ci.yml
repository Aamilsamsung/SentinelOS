name: CI
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel_ci
          POSTGRES_DB: sentinelos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinelos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sentinel:sentinel_ci@localhost:5432/sentinelos
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Synchronize lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: sync worker dependency lockfile"
          git push
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run db:migrate --workspace=@sentinelos/api
      - run: npm run db:migrate --workspace=@sentinelos/api
      - run: npm test
      - run: npm run build
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Build API Docker image
        run: docker build -t sentinelos-api:ci .
      - name: Build web Docker image
        run: docker build -f apps/web/Dockerfile -t sentinelos-web:ci .
