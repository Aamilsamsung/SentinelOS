name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel_ci
          POSTGRES_DB: sentinelos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinelos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sentinel:sentinel_ci@localhost:5432/sentinelos
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: git diff --exit-code -- package.json package-lock.json apps/api/package.json apps/web/package.json
      - run: npm audit --audit-level=high
      - run: npm run db:migrate --workspace=@sentinelos/api
      - run: npm run db:migrate --workspace=@sentinelos/api
      - run: npm test
      - run: npm run build
      - name: Smoke test ZIP inspection through live web server
        env:
          SENTINELOS_PREVIEW_MODE: "true"
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile("/tmp/sentinel-inspect-smoke.zip", "w", ZIP_DEFLATED) as archive:
              archive.writestr("README.md", "Sample source code health check")
              archive.writestr("package.json", '{"name":"sample-project"}')
              archive.writestr("src/example.ts", "export const healthy = true;")
          PY
          npm run start --workspace=@sentinelos/web -- -p 3029 > /tmp/sentinel-web-smoke.log 2>&1 &
          web_pid="$!"
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          web_ready=false
          for attempt in {1..25}; do
            if curl -fsS http://127.0.0.1:3029/login > /dev/null; then
              web_ready=true
              break
            fi
            sleep 1
          done
          if [ "$web_ready" != "true" ]; then
            cat /tmp/sentinel-web-smoke.log
            exit 1
          fi
          result="$(curl --fail-with-body -sS -X POST http://127.0.0.1:3029/api/source-inspection -H 'content-type: application/zip' -H 'origin: http://127.0.0.1:3029' -H 'x-source-filename: sentinel-inspect-smoke.zip' --data-binary @/tmp/sentinel-inspect-smoke.zip)"
          printf '%s' "$result" | node -e 'const fs=require("fs"); const report=JSON.parse(fs.readFileSync(0,"utf8")).data; if (!report || report.kind!=="zip" || report.filesDiscovered!==3 || report.filesInspected!==3 || !report.checks.some(c=>c.label==="Documentation"&&c.passed)) { console.error("Unexpected inspection report"); process.exit(1) } console.log("ZIP inspection returned a valid bounded static report")'
          blocked="$(curl -sS -o /tmp/scan-rejected.json -w '%{http_code}' -X POST http://127.0.0.1:3029/api/source-inspection -H 'content-type: application/zip' -H 'origin: https://untrusted.example' --data-binary @/tmp/sentinel-inspect-smoke.zip)"
          if [ "$blocked" != "403" ]; then
            cat /tmp/scan-rejected.json
            echo "Cross-origin ZIP inspection unexpectedly accepted"
            exit 1
          fi
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Build API Docker image
        run: docker build -t sentinelos-api:ci .
      - name: Build web Docker image
        run: docker build -f apps/web/Dockerfile -t sentinelos-web:ci .
      - name: Smoke test Compose runtime
        env:
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
        run: |
          docker compose -f compose.ci.yaml up -d postgres redis api worker web
          for attempt in {1..30}; do
            api_health="$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose -f compose.ci.yaml ps -q api)" 2>/dev/null || true)"
            worker_health="$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose -f compose.ci.yaml ps -q worker)" 2>/dev/null || true)"
            web_health="$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose -f compose.ci.yaml ps -q web)" 2>/dev/null || true)"
            if [ "$api_health" = "healthy" ] && [ "$worker_health" = "healthy" ] && [ "$web_health" = "healthy" ]; then
              break
            fi
            sleep 2
          done
          if [ "$api_health" != "healthy" ] || [ "$worker_health" != "healthy" ] || [ "$web_health" != "healthy" ]; then
            docker compose -f compose.ci.yaml ps
            docker compose -f compose.ci.yaml logs api worker web
            exit 1
          fi
          docker compose -f compose.ci.yaml exec -T redis redis-cli RPUSH sentinelos:jobs '{"type":"unsafe.probe"}'
          invalid_probe_seen=false
          for attempt in {1..15}; do
            if docker compose -f compose.ci.yaml logs worker | grep -q '"event":"job.rejected","reason":"invalid_job"'; then
              invalid_probe_seen=true
              break
            fi
            sleep 1
          done
          if [ "$invalid_probe_seen" != "true" ]; then
            docker compose -f compose.ci.yaml logs worker
            echo "worker did not consume the invalid Redis probe"
            exit 1
          fi

          # Prove the authenticated HTTP -> Redis -> worker -> PostgreSQL path without external AI.
          docker compose -f compose.ci.yaml exec -T api npm run db:migrate:prod --workspace=@sentinelos/api

          e2e_org="aaaaaaaa-1111-4111-8111-111111111111"
          e2e_user="bbbbbbbb-2222-4222-8222-222222222222"
          e2e_token="sentinelos-ci-e2e-token"
          e2e_hash="$(printf '%s' "$e2e_token" | sha256sum | cut -d' ' -f1)"
          docker compose -f compose.ci.yaml exec -T postgres psql -U sentinel -d sentinelos -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO organizations (id,name,slug) VALUES ('$e2e_org','CI E2E','ci-e2e') ON CONFLICT DO NOTHING;
          INSERT INTO users (id,email,display_name) VALUES ('$e2e_user','ci-e2e@example.test','CI E2E') ON CONFLICT DO NOTHING;
          INSERT INTO organization_memberships (organization_id,user_id,role) VALUES ('$e2e_org','$e2e_user','responder') ON CONFLICT DO NOTHING;
          INSERT INTO sessions (user_id,token_hash,expires_at) VALUES ('$e2e_user','$e2e_hash',now()+interval '1 hour') ON CONFLICT DO NOTHING;
          SQL
          incident_response="$(curl -fsS -X POST http://localhost:3001/v1/incidents -H "Authorization: Bearer $e2e_token" -H "x-organization-id: $e2e_org" -H 'content-type: application/json' --data '{"title":"CI pipeline incident","summary":"Runtime E2E","severity":"warning","source":"ci-e2e","detectedAt":"2026-10-06T12:00:00.000Z"}')"
          incident_id="$(printf '%s' "$incident_response" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).data.id')"
          investigation_response="$(curl -fsS -X POST "http://localhost:3001/v1/incidents/$incident_id/investigations" -H "Authorization: Bearer $e2e_token" -H "x-organization-id: $e2e_org")"
          investigation_id="$(printf '%s' "$investigation_response" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).data.id')"
          curl -fsS -X POST "http://localhost:3001/v1/investigations/$investigation_id/run" -H "Authorization: Bearer $e2e_token" -H "x-organization-id: $e2e_org" >/dev/null
          for attempt in {1..20}; do
            investigation_status="$(docker compose -f compose.ci.yaml exec -T postgres psql -U sentinel -d sentinelos -Atc "SELECT status FROM investigations WHERE id='$investigation_id';" | tr -d '\r')"
            if [ "$investigation_status" = "failed" ]; then
              break
            fi
            sleep 1
          done
          if [ "$investigation_status" != "failed" ]; then
            docker compose -f compose.ci.yaml logs api worker
            echo "API-to-worker investigation pipeline did not persist the expected controlled failure"
            exit 1
          fi

          dead_job='{"version":1,"type":"investigation.run","jobId":"11111111-1111-4111-8111-111111111111","organizationId":"22222222-2222-4222-8222-222222222222","investigationId":"33333333-3333-4333-8333-333333333333","requestedByUserId":"44444444-4444-4444-8444-444444444444","enqueuedAt":"2026-10-06T12:00:00.000Z","attempt":2}'
          docker compose -f compose.ci.yaml exec -T redis redis-cli RPUSH sentinelos:jobs "$dead_job"
          for attempt in {1..15}; do
            dead_count="$(docker compose -f compose.ci.yaml exec -T redis redis-cli LLEN sentinelos:jobs:dead | tr -d '\r')"
            if [ "$dead_count" -ge 1 ]; then
              docker compose -f compose.ci.yaml exec -T redis redis-cli LRANGE sentinelos:jobs:dead 0 -1 | grep -q '"attempt":3'
              exit 0
            fi
            sleep 1
          done
          docker compose -f compose.ci.yaml logs worker
          echo "worker did not dead-letter the exhausted investigation job"
          exit 1
      - name: Stop Compose runtime
        if: always()
        run: docker compose -f compose.ci.yaml down -v
